name: budget-calender-dev

services:
  app:
    build:
      context: .
      target: development
    init: true
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-budget_calendar}:${POSTGRES_PASSWORD:-budget_calendar_dev}@db:5432/${POSTGRES_DB:-budget_calendar}?schema=public
    volumes:
      - .:/usr/src/app
      - app-node-modules:/usr/src/app/node_modules
      - app-next-cache:/usr/src/app/.next
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "npx prisma generate &&
      npx prisma migrate deploy &&
      npm run dev"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-budget_calendar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budget_calendar_dev}
      POSTGRES_DB: ${POSTGRES_DB:-budget_calendar}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  app-node-modules:
  app-next-cache:
  postgres-data:
